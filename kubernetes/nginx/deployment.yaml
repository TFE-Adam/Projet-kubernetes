apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-web
  namespace: nginx-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-web

  template:
    metadata:
      labels:
        app: nginx-web

    spec:
      containers:
      - name: nginx
        image: adamk8s/nginx-web:v5

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"
