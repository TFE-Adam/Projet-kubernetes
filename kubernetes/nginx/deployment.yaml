apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx-web
  namespace: nginx-web

spec:
  replicas: 2

  selector:
    matchLabels:
      app: nginx-web

  template:
    metadata:
      labels:
        app: nginx-web
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9113"
        prometheus.io/path: "/metrics"

    spec:
      containers:
      - name: nginx
        image: adamk8s/nginx-web:v5

        ports:
        - containerPort: 80

        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "500m"
            memory: "256Mi"

      - name: nginx-exporter
        image: nginx/nginx-prometheus-exporter:1.4.2

        args:
        - --nginx.scrape-uri=http://127.0.0.1/nginx_status

        ports:
        - containerPort: 9113
